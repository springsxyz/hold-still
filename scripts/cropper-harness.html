<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hold Still cropper harness</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #log {
        position: fixed; right: 0; bottom: 0; z-index: 10; max-width: 46ch;
        margin: 0; padding: 10px 12px; background: #0f172a; color: #e2e8f0;
        font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="log">waiting…</pre>

    <script>
      // Stub the extension surface cropper.js talks to, then hand it the real
      // markup, stylesheet and script so the harness cannot drift from what
      // ships.
      const logEl = document.querySelector("#log");
      const lines = [];
      function log(text) {
        lines.push(text);
        logEl.textContent = lines.join("\n");
      }

      function buildTestCapture() {
        const canvas = document.createElement("canvas");
        canvas.width = 2400;
        canvas.height = 1400;
        const context = canvas.getContext("2d");
        context.fillStyle = "#f1f5f9";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = "#94a3b8";
        for (let x = 0; x < canvas.width; x += 200) {
          context.beginPath();
          context.moveTo(x, 0);
          context.lineTo(x, canvas.height);
          context.stroke();
        }
        for (let y = 0; y < canvas.height; y += 200) {
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(canvas.width, y);
          context.stroke();
        }
        context.fillStyle = "#b83b2d";
        context.fillRect(400, 400, 400, 200);
        context.fillStyle = "#0f172a";
        context.font = "700 64px system-ui, sans-serif";
        context.fillText("2400 x 1400 capture", 400, 900);
        return canvas.toDataURL("image/png");
      }

      const testCapture = buildTestCapture();

      window.chrome = {
        runtime: {
          onMessage: { addListener() {} },
          async sendMessage(message) {
            if (message.type === "HOLD_STILL_CROPPER_READY") {
              log("READY -> returning 2400x1400 capture");
              return { ok: true, dataUrl: testCapture };
            }
            if (message.type === "HOLD_STILL_CROPPER_RESULT") {
              const s = message.selection;
              const scale = 2400 / s.viewportWidth;
              log(
                "RESULT selection (displayed px):\n" +
                  "  left " + Math.round(s.left) + "  top " + Math.round(s.top) +
                  "  w " + Math.round(s.width) + "  h " + Math.round(s.height) + "\n" +
                  "  reference frame " + Math.round(s.viewportWidth) + " x " +
                  Math.round(s.viewportHeight) + "\n" +
                  "maps to capture px:\n" +
                  "  left " + Math.round(s.left * scale) + "  top " + Math.round(s.top * scale) +
                  "  w " + Math.round(s.width * scale) + "  h " + Math.round(s.height * scale)
              );
              return { ok: true };
            }
            if (message.type === "HOLD_STILL_CROPPER_CANCELLED") {
              log("CANCELLED");
              return { ok: true };
            }
            return { ok: true };
          }
        }
      };

      window.close = () => log("window.close() called");

      (async () => {
        const markup = await (await fetch("/cropper/cropper.html")).text();
        const parsed = new DOMParser().parseFromString(markup, "text/html");

        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "/cropper/cropper.css";
        document.head.appendChild(stylesheet);

        const shell = document.createElement("div");
        shell.style.cssText = "display:flex;flex-direction:column;height:100%";
        shell.innerHTML = parsed.body.innerHTML;
        for (const stale of shell.querySelectorAll("script")) stale.remove();
        document.body.insertBefore(shell, logEl);

        const script = document.createElement("script");
        script.src = "/cropper/cropper.js";
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
