<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Select an area — Hold Still</title>
    <link rel="stylesheet" href="cropper.css">
  </head>
  <body>
    <header class="bar">
      <p id="hint">Drag to select an area</p>
      <button id="cancel" type="button">Cancel</button>
    </header>
    <main class="stage">
      <div class="frame">
        <img id="shot" alt="Captured page">
        <div id="selection" class="selection"><span id="size" class="size"></span></div>
      </div>
    </main>
    <script src="cropper.js"></script>
  </body>
</html>
