<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copy screenshot — Hold Still</title>
    <link rel="stylesheet" href="clipboard.css">
  </head>
  <body>
    <main class="copy-panel">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M7.5 5.5 9 3h6l1.5 2.5H19A2.5 2.5 0 0 1 21.5 8v9A2.5 2.5 0 0 1 19 19.5H5A2.5 2.5 0 0 1 2.5 17V8A2.5 2.5 0 0 1 5 5.5h2.5Z"></path>
          <circle cx="12" cy="12.5" r="3.5"></circle>
        </svg>
      </div>
      <div class="message">
        <h1 id="title">Copying screenshot…</h1>
        <p id="status">Hold Still is placing the PNG on your clipboard.</p>
      </div>
      <button id="retry" type="button" hidden>Copy image</button>
    </main>
    <script src="clipboard.js"></script>
  </body>
</html>
